worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format monitor_json escape=json '{"timestamp":"$time_iso8601","method":"$request_method","uri":"$uri","status":"$status","upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","request_time":"$request_time","upstream_response_time":"$upstream_response_time"}';

    access_log logs/access.log monitor_json;

    upstream vehiculos_backend {
        server 127.0.0.1:8080 weight=3 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8082 weight=1 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 127.0.0.1:8090;
        server_name localhost;

        location = /nginx-ping {
            allow 127.0.0.1;
            deny all;
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","mensaje":"NGINX operativo"}';
        }

        location / {
            proxy_pass http://vehiculos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}

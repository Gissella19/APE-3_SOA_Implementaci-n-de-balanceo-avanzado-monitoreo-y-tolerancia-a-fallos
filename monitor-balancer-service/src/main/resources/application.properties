spring.application.name=monitor-balancer-service
server.port=8083
server.address=127.0.0.1

# Timeouts finitos del cliente HTTP en milisegundos
monitor.connect-timeout-ms=2000
monitor.read-timeout-ms=2000

# Catalogo configurable de destinos
monitor.nginx.nombre=NGINX
monitor.nginx.url=http://127.0.0.1:8090/nginx-ping

monitor.instancias[0].nombre=Vehiculos-A
monitor.instancias[0].puerto=8080
monitor.instancias[0].url=http://127.0.0.1:8080/actuator/health

monitor.instancias[1].nombre=Vehiculos-B
monitor.instancias[1].puerto=8082
monitor.instancias[1].url=http://127.0.0.1:8082/actuator/health

# Lectura del access.log de NGINX
monitor.log.ruta=C:/nginx/logs/access.log
monitor.log.ventana-minutos=15
monitor.log.inicio=
monitor.log.excluir-prefijos=/nginx-ping,/actuator,/oauth
monitor.intervalo-ms=5000